<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Invaders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            display: block;
            border: 2px solid #333;
        }
        #controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .control-btn {
            width: 80px;
            height: 80px;
            font-size: 30px;
            background: #222;
            color: #fff;
            border: 2px solid #444;
            border-radius: 15px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:active {
            background: #444;
        }
        #shootBtn {
            width: 120px;
            background: #600;
            border-color: #900;
        }
        #shootBtn:active {
            background: #900;
        }
        #startScreen, #gameOverScreen, #winScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #0f0;
        }
        .screen-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #0a0;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        .screen-btn:hover {
            background: #0c0;
        }
        #gameOverScreen h1 {
            color: #f00;
        }
        #score-display {
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="score-display">Score: 0 | Lives: 3</div>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="startScreen">
            <h1>SPACE INVADERS</h1>
            <p style="color: #aaa; margin-bottom: 10px;">iPad: Use buttons below</p>
            <p style="color: #aaa;">PC: Arrow keys + Space</p>
            <button class="screen-btn" onclick="startGame()">START</button>
        </div>

        <div id="gameOverScreen" class="hidden">
            <h1>GAME OVER</h1>
            <p style="color: #fff; font-size: 24px;" id="finalScore"></p>
            <button class="screen-btn" onclick="startGame()">RETRY</button>
        </div>

        <div id="winScreen" class="hidden">
            <h1 style="color: #0f0;">YOU WIN!</h1>
            <p style="color: #fff; font-size: 24px;" id="winScore"></p>
            <button class="screen-btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" id="leftBtn">&#9664;</button>
        <button class="control-btn" id="shootBtn">FIRE</button>
        <button class="control-btn" id="rightBtn">&#9654;</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive canvas size
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth - 20, 600);
            const maxHeight = Math.min(window.innerHeight - 200, 500);
            canvas.width = maxWidth;
            canvas.height = maxHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let gameRunning = false;
        let score = 0;
        let lives = 3;

        // Player
        const player = {
            width: 40,
            height: 25,
            x: 0,
            y: 0,
            speed: 5,
            color: '#0f0'
        };

        // Bullets
        let bullets = [];
        let enemyBullets = [];

        // Enemies
        let enemies = [];
        let enemyDirection = 1;
        let enemySpeed = 1;

        // Controls
        let moveLeft = false;
        let moveRight = false;
        let shootCooldown = 0;
        let enemyShootTimer = 0;

        function initGame() {
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 50;
            bullets = [];
            enemyBullets = [];
            enemies = [];
            score = 0;
            lives = 3;
            enemyDirection = 1;
            enemySpeed = 1;
            shootCooldown = 0;
            enemyShootTimer = 0;

            // Create enemies
            const cols = Math.floor(canvas.width / 55);
            const rows = 3;
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    enemies.push({
                        x: 30 + col * 50,
                        y: 40 + row * 45,
                        width: 35,
                        height: 25,
                        color: row === 0 ? '#f00' : row === 1 ? '#f80' : '#ff0'
                    });
                }
            }

            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = `Score: ${score} | Lives: ${lives}`;
        }

        function drawPlayer() {
            ctx.fillStyle = player.color;
            // Triangle ship
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 12, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x + 3, enemy.y, enemy.width - 6, enemy.height - 8);
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(enemy.x + 10, enemy.y + 8, 4, 0, Math.PI * 2);
                ctx.arc(enemy.x + 25, enemy.y + 8, 4, 0, Math.PI * 2);
                ctx.fill();
                // Legs
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y + 17, 6, 8);
                ctx.fillRect(enemy.x + 29, enemy.y + 17, 6, 8);
            });
        }

        function drawBullets() {
            ctx.fillStyle = '#ff0';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, 4, 12);
            });

            ctx.fillStyle = '#f00';
            enemyBullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, 4, 10);
            });
        }

        function drawStars() {
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 50; i++) {
                const x = (i * 73) % canvas.width;
                const y = (i * 91) % canvas.height;
                ctx.fillRect(x, y, 1, 1);
            }
        }

        function shoot() {
            if (shootCooldown <= 0) {
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    speed: 8
                });
                shootCooldown = 20;
            }
        }

        function enemyShoot() {
            if (enemies.length > 0 && enemyShootTimer <= 0) {
                const shooter = enemies[Math.floor(Math.random() * enemies.length)];
                enemyBullets.push({
                    x: shooter.x + shooter.width / 2,
                    y: shooter.y + shooter.height,
                    speed: 4
                });
                enemyShootTimer = 80;
            }
        }

        function moveEnemies() {
            let shouldMoveDown = false;

            enemies.forEach(enemy => {
                if (enemy.x + enemy.width >= canvas.width - 5 || enemy.x <= 5) {
                    shouldMoveDown = true;
                }
            });

            if (shouldMoveDown) {
                enemyDirection *= -1;
                enemies.forEach(enemy => {
                    enemy.y += 15;
                });
            }

            enemies.forEach(enemy => {
                enemy.x += enemySpeed * enemyDirection;
            });
        }

        function checkCollisions() {
            // Player bullets vs enemies
            bullets.forEach((bullet, bi) => {
                enemies.forEach((enemy, ei) => {
                    if (bullet.x < enemy.x + enemy.width &&
                        bullet.x + 4 > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + 12 > enemy.y) {
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);
                        score += 100;
                        updateScoreDisplay();
                    }
                });
            });

            // Enemy bullets vs player
            enemyBullets.forEach((bullet, bi) => {
                if (bullet.x < player.x + player.width &&
                    bullet.x + 4 > player.x &&
                    bullet.y < player.y + player.height &&
                    bullet.y + 10 > player.y) {
                    enemyBullets.splice(bi, 1);
                    lives--;
                    updateScoreDisplay();
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            });

            // Enemies reaching player
            enemies.forEach(enemy => {
                if (enemy.y + enemy.height >= player.y) {
                    gameOver();
                }
            });
        }

        function update() {
            if (!gameRunning) return;

            // Move player
            if (moveLeft && player.x > 0) {
                player.x -= player.speed;
            }
            if (moveRight && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Cooldowns
            if (shootCooldown > 0) shootCooldown--;
            if (enemyShootTimer > 0) enemyShootTimer--;

            // Move bullets
            bullets = bullets.filter(bullet => {
                bullet.y -= bullet.speed;
                return bullet.y > 0;
            });

            enemyBullets = enemyBullets.filter(bullet => {
                bullet.y += bullet.speed;
                return bullet.y < canvas.height;
            });

            // Move enemies
            moveEnemies();

            // Enemy shooting
            enemyShoot();

            // Check collisions
            checkCollisions();

            // Win condition
            if (enemies.length === 0) {
                winGame();
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawStars();
            drawPlayer();
            drawEnemies();
            drawBullets();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('winScreen').classList.add('hidden');
            initGame();
            gameRunning = true;
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = `Score: ${score}`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function winGame() {
            gameRunning = false;
            document.getElementById('winScore').textContent = `Score: ${score}`;
            document.getElementById('winScreen').classList.remove('hidden');
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft = true;
            if (e.key === 'ArrowRight') moveRight = true;
            if (e.key === ' ') {
                e.preventDefault();
                shoot();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') moveLeft = false;
            if (e.key === 'ArrowRight') moveRight = false;
        });

        // Touch controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const shootBtn = document.getElementById('shootBtn');

        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
        leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });
        leftBtn.addEventListener('mousedown', () => moveLeft = true);
        leftBtn.addEventListener('mouseup', () => moveLeft = false);
        leftBtn.addEventListener('mouseleave', () => moveLeft = false);

        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
        rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });
        rightBtn.addEventListener('mousedown', () => moveRight = true);
        rightBtn.addEventListener('mouseup', () => moveRight = false);
        rightBtn.addEventListener('mouseleave', () => moveRight = false);

        shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
        shootBtn.addEventListener('mousedown', () => shoot());

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
